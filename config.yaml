project:
  timezone: Asia/Taipei
  price_return_method: simple   # simple | log

paths:
  data_dir: data
  saa_raw_xlsx: "SAA_RawData.xlsx"
  taa_raw_xlsx: "TAA_RawData.xlsx"

universe:
  market_list: ["SPX Index","SXXP Index","NKY Index","MXMS Index","SHCOMP Index","TWSE Index"]
  industry_list: ["科技"]
  bond_list: ["投資級債","非投資級債","新興市場債"]
  benchmark_cols: ["MXWO_Index","LEGATRUU_Index","LG30TRUU_Index"]

dates:
  start_date: "2010-12-31"              # 建構投組的起點（在此前一月末完成建構）
  backtest_start: "2012-01-31"
  # backtest_end 可填具體月底（如 "2025-10-31"）；填 "auto" 則自動偵測
  # SAA_RawData.xlsx 之 RETURN 工作表最新月份，更新 Excel 後免改此處。
  backtest_end: "auto"

schedule:
  T_months: 180                         # 12*15
  weight_update_freq_months: 1          # t
  rebalance_rule: "Q"                   # M | A | Q | 2Q-DEC

risk:
  lookback_months: 36
  mar: 0.0                              # Sortino 下行門檻（同頻報酬率門檻；月頻用 0.0 表示 0%）
  cov_method: ledoitwolf                # ledoitwolf | sample
  annualize_factor: 12                  # 月頻=12

return_model:
  rolling_years: 5
  lookback_mom_months: 3

constraints:
  lower: 0.0
  upper: 0.5
  stock_type_limit: 0.7                 # 股票(市場+產業)權重上限
  bond_type_floor: 0.2                  # 債券(bond_list)總權重下限（積極型預設）

optimizer:
  objective: "sortino"                  # sharpe | sortino | utility
  l2_gamma: 0.1                         # 權重平滑（L2 正則）
  risk_aversion: 2.0                    # max_quadratic_utility 的 risk_aversion

backtest:
  starting_capital: 1.0
  trading_cost_bps: 0.0
  rf_annual: 0.0

taa:
  enabled: true
  # 各風險屬性「股債比」最大調整幅度 X（保守型 0 = 不啟用 TAA）
  profile_max_adjust:
    積極型投資人: 0.10
    成長型投資人: 0.08
    穩健型投資人: 0.06
    保守型投資人: 0.00
  nfp_threshold: 50                # 非農新增就業門檻（千人）；可由 UI 覆寫
  pmi_threshold: 50                 # ISM 美國綜合PMI 榮枯線（NAPMALL Index）
  # 評價面（ERP）對 X 的乘數：依加/減碼方向 × ERP 分數查表
  valuation_multipliers:
    plus_1: 1.00                   # ERP +1（便宜）
    zero: 0.75                     # ERP 0（正常）
    minus_1: 0.50                  # ERP -1（昂貴）
  add_target: "SPX_Index"          # 加碼去處
  reduce_target: "投資級債"         # 減碼釋出去處（LEGATRUU Index）
